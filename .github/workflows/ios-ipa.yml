name: iOS IPA

# Best-effort companion to daily-release.yml.
#
# The iOS .ipa needs a GitHub-hosted macOS runner. Those runners are
# capacity-constrained ("Due to capacity constraints, jobs targeting macOS
# arm64 runners may experience longer queue times") and GitHub gives up on the
# job after a while with "The job was not acquired by Runner of type hosted
# even after multiple attempts". That leaves the job `cancelled`, which - unlike
# a normal failure - is NOT covered by `continue-on-error`, so building the
# .ipa inside the daily release marked the whole release run failed even though
# the Docker image, the APK and both GitHub releases were fine.
#
# So the .ipa build lives here instead:
#   * it runs right after every Daily release run (workflow_run),
#   * it retries on the other macOS runner pool when the primary pool never
#     hands out a machine, and on two off-peak schedules,
#   * every attempt is idempotent - the gate is a ~10 s Ubuntu job that exits
#     green when the current releases already carry the .ipa,
#   * and a capacity cancellation here can never fail a Docker/Android release.
#
# Both macOS build jobs use `continue-on-error: true`, so a run of this
# workflow is red only when no .ipa could be delivered at all, which is what
# the failed `Attach .ipa to GitHub releases` job then reports.
#
# The artifact is unsigned. Sign it with a free Apple ID via AltStore or
# SideStore to install it.

on:
  schedule:
    # Retry attempts. No-op unless the newest dated release / latest release is
    # missing its .ipa. Deliberately spread away from the daily release window.
    - cron: "37 4 * * *"
    - cron: "37 21 * * *"
  workflow_run:
    workflows: ["Daily release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-attach the .ipa even if the releases already have one"
        required:
          false
        type: boolean
        default: false
      build_runner:
        description: "Primary macOS runner label (the other pool is used as fallback)"
        required:
          false
        type: choice
        options:
          - macos-latest
          - macos-26-intel
        default: macos-latest

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  gate:
    name: Decide whether an .ipa build is needed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      ipa_name: ${{ steps.plan.outputs.ipa_name }}
      primary_runner: ${{ steps.plan.outputs.primary_runner }}
      fallback_runner: ${{ steps.plan.outputs.fallback_runner }}

    steps:
      - name: Inspect current releases
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
          REQUESTED_RUNNER: ${{ github.event.inputs.build_runner }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # Newest dated release tag published by daily-release.yml.
          release_tag="$(gh release list -R "$repo" --limit 25 --json tagName --jq '.[].tagName' \
            | grep -E '^20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9]{6}$' \
            | head -n 1 || true)"

          needed=true
          ipa_name=""
          if [ -z "$release_tag" ]; then
            needed=false
            echo "No dated release found yet - nothing to attach an .ipa to."
          else
            ipa_name="caldaver-ios-${release_tag}.ipa"
            dated_has="$(gh api "repos/$repo/releases/tags/$release_tag" \
              --jq "[.assets[].name] | index(\"$ipa_name\") != null" 2>/dev/null || echo false)"
            latest_has="$(gh api "repos/$repo/releases/tags/latest" \
              --jq "[.assets[].name] | index(\"$ipa_name\") != null" 2>/dev/null || echo false)"

            if [ "$FORCE" != "true" ] && [ "$dated_has" = "true" ] && [ "$latest_has" = "true" ]; then
              needed=false
              echo "$ipa_name is already attached to both '$release_tag' and 'latest' - no build needed."
            else
              echo "Building $ipa_name (dated release has it: $dated_has, latest has it: $latest_has, forced: $FORCE)."
            fi
          fi

          # arm64 and Intel macOS runners are separate capacity pools; use the
          # other one when the primary pool cannot hand out a machine.
          primary_runner="${REQUESTED_RUNNER:-macos-latest}"
          case "$primary_runner" in
            macos-latest|macos-26) fallback_runner="macos-26-intel" ;;
            *) fallback_runner="macos-latest" ;;
          esac

          {
            echo "needed=$needed"
            echo "release_tag=$release_tag"
            echo "ipa_name=$ipa_name"
            echo "primary_runner=$primary_runner"
            echo "fallback_runner=$fallback_runner"
          } >> "$GITHUB_OUTPUT"

  build_primary:
    name: Build unsigned .ipa (primary macOS pool)
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: ${{ needs.gate.outputs.primary_runner }}
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.gate.outputs.release_tag }}
          fetch-depth: 1

      # The release tag predates .github/actions/ios-ipa and a local action is
      # read from the workspace, so borrow the CI helpers from the commit that is
      # actually running this workflow.
      - name: Take CI helpers from the running commit
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/actions/ios-ipa/action.yml ]; then
            git fetch --depth=1 origin "$GITHUB_SHA" \
              || git fetch --no-tags origin "$GITHUB_SHA"
            git checkout "$GITHUB_SHA" -- .github
          fi

      - name: Build and package the .ipa
        id: ipa
        uses: ./.github/actions/ios-ipa
        with:
          release_tag: ${{ needs.gate.outputs.release_tag }}
          node_version: ${{ env.NODE_VERSION }}

      - name: Upload iOS .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: caldaver-ios-ipa-primary
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

  build_fallback:
    name: Build unsigned .ipa (fallback macOS pool)
    needs:
      - gate
      - build_primary
    # always(): build_primary may have been cancelled by GitHub because no macOS
    # runner of its pool was ever acquired, and that must not lose the .ipa.
    # Note `continue-on-error` makes a *failed* primary build look 'success'
    # here, so this job only covers runner-pool outages, not build errors.
    if: >-
      always() && needs.gate.outputs.needed == 'true' &&
      needs.build_primary.result != 'success'
    runs-on: ${{ needs.gate.outputs.fallback_runner }}
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.gate.outputs.release_tag }}
          fetch-depth: 1

      # The release tag predates .github/actions/ios-ipa and a local action is
      # read from the workspace, so borrow the CI helpers from the commit that is
      # actually running this workflow.
      - name: Take CI helpers from the running commit
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/actions/ios-ipa/action.yml ]; then
            git fetch --depth=1 origin "$GITHUB_SHA" \
              || git fetch --no-tags origin "$GITHUB_SHA"
            git checkout "$GITHUB_SHA" -- .github
          fi

      - name: Build and package the .ipa
        id: ipa
        uses: ./.github/actions/ios-ipa
        with:
          release_tag: ${{ needs.gate.outputs.release_tag }}
          node_version: ${{ env.NODE_VERSION }}

      - name: Upload iOS .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: caldaver-ios-ipa-fallback
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach .ipa to GitHub releases
    needs:
      - gate
      - build_primary
      - build_fallback
    if: always() && needs.gate.outputs.needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download built .ipa
        uses: actions/download-artifact@v4
        with:
          patterns: caldaver-ios-ipa-*
          merge-multiple: true
          path: build/ios
          fail-on-unmatched-patterns: false

      - name: Publish .ipa on the dated and latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          IPA_NAME: ${{ needs.gate.outputs.ipa_name }}
          PRIMARY: ${{ needs.build_primary.result }}
          FALLBACK: ${{ needs.build_fallback.result }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          mkdir -p build/ios
          ipa="$(find build/ios -maxdepth 2 -type f -name 'caldaver-ios-*.ipa' | head -n 1)"

          if [ -z "$ipa" ]; then
            {
              echo "## iOS .ipa could not be published"
              echo
              echo "- Target release: \`$RELEASE_TAG\`"
              echo "- Primary macOS build: \`$PRIMARY\`"
              echo "- Fallback macOS build: \`$FALLBACK\`"
              echo
              echo "No .ipa artifact was produced, so \`$IPA_NAME\` is not attached to"
              echo "\`$RELEASE_TAG\` / \`latest\`. GitHub could not provide a macOS"
              echo "runner, or the iOS build itself failed. The scheduled retries of this"
              echo "workflow pick it up; the Docker image, the Android APK and both"
              echo "GitHub releases are unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no .ipa artifact was produced (primary: $PRIMARY, fallback: $FALLBACK)"
            exit 1
          fi

          echo "Publishing $ipa ($(stat -c %s "$ipa") bytes)"

          for tag in "$RELEASE_TAG" latest; do
            # Drop .ipa assets from older release tags so 'latest' never keeps
            # pointing at a stale build.
            stale="$(gh api "repos/$repo/releases/tags/$tag" \
              --jq "[.assets[] | select(.name | test(\"^caldaver-ios-.*\\\\.ipa$\")) | .name] | .[]" 2>/dev/null \
              | grep -v "^${IPA_NAME}$" || true)"
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset -R "$repo" "$tag" "$asset" --yes
            done <<< "$stale"
            gh release upload -R "$repo" "$tag" "$ipa" --clobber
            echo "$tag -> $(gh release view -R "$repo" "$tag" --json assets --jq '[.assets[].name] | join(", ")')"
          done

          {
            echo "## iOS .ipa published"
            echo
            echo "- \`$IPA_NAME\` attached to \`$RELEASE_TAG\` and \`latest\`"
            echo "- Built from the \`$RELEASE_TAG\` commit"
          } >> "$GITHUB_STEP_SUMMARY"
