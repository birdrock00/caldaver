name: Daily release

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      release_title:
        description: "Optional GitHub release title"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.release.outputs.date_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      image_repo: ${{ steps.release.outputs.image_repo }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          date_tag="$(date -u +'%Y-%m-%d')"
          release_tag="$(date -u +'%Y-%m-%d-%H%M%S')"
          release_title="${{ github.event.inputs.release_title || '' }}"
          if [ -z "$release_title" ]; then
            release_title="CalDaver $release_tag"
          fi
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          git fetch --tags --force
          previous_tag="$(git tag --list '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]*' --sort=-creatordate | awk -v current="$release_tag" '$0 != current && $0 != "latest" { print; exit }')"
          {
            echo "date_tag=$date_tag"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "image_repo=$image_repo"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.release_tag }}
            ${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.date_tag }}
            ${{ needs.prepare.outputs.image_repo }}:latest

  android:
    name: Publish Android APK release
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          scripts/android-sdk-setup.sh \
            --sdk-root "$sdk_root" \
            --api-level "$ANDROID_API_LEVEL" \
            --build-tools "$ANDROID_BUILD_TOOLS_VERSION"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build Capacitor Android APK
        shell: bash
        env:
          BUILD_TYPE: release
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: scripts/ci/build-capacitor-android-apk.sh

      - name: Name APK with release date
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/android-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          mv "$apk" "build/android-apk/caldaver-android-${{ needs.prepare.outputs.release_tag }}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caldaver-android-apk
          path: build/android-apk/*.apk
          if-no-files-found: error

  # Releases ship a Docker image and a signed Android APK only. There is no iOS
  # build: it needed a capacity-constrained GitHub-hosted macOS runner, whose
  # queue starvation surfaced as a `cancelled` job (not covered by
  # continue-on-error) that failed otherwise healthy release runs.
  release:
    name: Publish GitHub releases
    runs-on: ubuntu-latest
    needs:
      - prepare
      - docker
      - android
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: caldaver-android-apk
          path: build/android-apk

      - name: Publish release and latest git tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          # Moving `latest` is the only thing in this workflow that has failed
          # intermittently (`! [remote rejected] latest -> latest (failed)`, with
          # no ruleset or tag-protection rule on the repo -- GitHub refuses the
          # ref update server-side and git names the reason only as "failed").
          # Two changes make the step tolerant of it:
          #   * skip the push when origin already points the tag at this exact
          #     commit, which is the common case on a day with no new code;
          #   * retry the force-push with backoff, then fall back to the Git
          #     Data API, which returns the actual rejection message.
          remote_commit() {
            # Commit a remote tag ref resolves to. ls-remote peels annotated tags
            # into an extra "<ref>^{}" line, but only in a patternless listing -
            # asking for one ref by name returns the tag-object id, which changes
            # every time the tag is re-created and is useless for this compare.
            git ls-remote origin | awk -v peel_ref="refs/tags/$1^{}" -v tag_ref="refs/tags/$1" '
              $2 == peel_ref { peeled = $1 }
              $2 == tag_ref  { base   = $1 }
              END { print (peeled != "" ? peeled : base) }'
          }

          push_moved_tag() {
            local tag="$1" attempt
            for attempt in 1 2 3 4 5; do
              if [ "$(remote_commit "$tag")" = "$GITHUB_SHA" ]; then
                echo "refs/tags/$tag already points at $GITHUB_SHA on origin, nothing to push"
                return 0
              fi

              git tag -fa "$tag" "$GITHUB_SHA" -m "Caldaver release $tag" >/dev/null
              if git push --force origin "refs/tags/$tag"; then
                echo "pushed refs/tags/$tag -> $GITHUB_SHA (attempt $attempt)"
                return 0
              fi

              echo "::warning title=Tag push rejected::refs/tags/$tag rejected on attempt $attempt/5, retrying"
              sleep $((attempt * 20))
              git fetch --tags --force origin || true
            done

            echo "git push exhausted its retries for $tag, trying the Git Data API for a real error"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" -F force=true
          }

          push_moved_tag "${{ needs.prepare.outputs.release_tag }}"
          push_moved_tag latest

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Artifacts"
            echo
            echo "- Docker image: \`${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.release_tag }}\`"
            echo "- Docker image date alias: \`${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.date_tag }}\`"
            echo "- Docker image: \`${{ needs.prepare.outputs.image_repo }}:latest\`"
            echo "- Android APK: attached to this release"
            echo "- Source code: GitHub-generated source archives for this tag"
            echo
            echo "## Changes"
            echo
          } > "$notes_file"

          previous_tag="${{ needs.prepare.outputs.previous_tag }}"
          if [ -n "$previous_tag" ] && git rev-parse --verify --quiet "refs/tags/$previous_tag" >/dev/null; then
            range="$previous_tag..HEAD"
            echo "Changes since \`$previous_tag\`:" >> "$notes_file"
            echo >> "$notes_file"
          else
            range="HEAD"
            echo "All reachable changes in this release:" >> "$notes_file"
            echo >> "$notes_file"
          fi

          if git log --format='- %s (%h)' "$range" >> "$notes_file"; then
            if ! grep -q '^- ' "$notes_file"; then
              echo "- No code changes since the previous release." >> "$notes_file"
            fi
          else
            echo "- Unable to calculate git change list." >> "$notes_file"
          fi

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish dated GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ needs.prepare.outputs.release_tag }}" >/dev/null 2>&1; then
            gh release edit "${{ needs.prepare.outputs.release_tag }}" \
              --title "${{ needs.prepare.outputs.release_title }}" \
              --notes-file "${{ steps.notes.outputs.notes_file }}"
          else
            gh release create "${{ needs.prepare.outputs.release_tag }}" \
              --title "${{ needs.prepare.outputs.release_title }}" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              --latest=false
          fi
          assets="$(gh release view "${{ needs.prepare.outputs.release_tag }}" --json assets --jq '.assets[].name' | grep '^caldaver-android-.*\.apk$' || true)"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset "${{ needs.prepare.outputs.release_tag }}" "$asset" --yes
          done <<< "$assets"
          gh release upload "${{ needs.prepare.outputs.release_tag }}" build/android-apk/*.apk --clobber

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes
          fi
          gh release create latest \
            --title "CalDaver latest" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --latest
          assets="$(gh release view latest --json assets --jq '.assets[].name' | grep '^caldaver-android-.*\.apk$' || true)"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset latest "$asset" --yes
          done <<< "$assets"
          gh release upload latest build/android-apk/*.apk --clobber
