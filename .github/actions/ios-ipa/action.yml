name: Build unsigned iOS .ipa
description: >-
  Builds the Capacitor iOS app with xcodebuild (no code signing) and packages a
  sideloadable .ipa for AltStore/SideStore. Runs on any macOS runner
  (arm64 or Intel).

inputs:
  release_tag:
    description: "Release tag used to name the .ipa (caldaver-ios-<release_tag>.ipa)"
    required: true
  node_version:
    description: "Node.js version for the frontend build"
    required: false
    default: "22"

outputs:
  ipa_path:
    description: "Workspace-relative path of the packaged .ipa"
    value: ${{ steps.package.outputs.ipa_path }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install Node dependencies
      shell: bash
      run: npm install --no-audit --no-fund

    - name: Build frontend assets
      shell: bash
      run: npm run build

    - name: Add iOS platform
      shell: bash
      run: npx cap add ios

    - name: Sync web assets to iOS
      shell: bash
      run: npx cap sync ios

    - name: Build unsigned iOS .app
      working-directory: ios/App
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild \
          -project App.xcodeproj \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          EXPANDED_CODE_SIGN_IDENTITY="" \
          build

    - name: Package iOS .ipa (unsigned, for AltStore/SideStore sideload)
      id: package
      shell: bash
      run: |
        set -euo pipefail

        app="ios/App/build/Build/Products/Release-iphoneos/App.app"
        if [ ! -d "$app" ]; then
          echo "::error::xcodebuild did not produce $app"
          find ios/App/build/Build/Products -maxdepth 2 -type d 2>/dev/null || true
          exit 1
        fi

        # A .ipa is a zip whose Payload directory must contain the app *bundle*
        # (Payload/App.app/Info.plist). Copying the bundle contents into
        # Payload/ directly produces an archive AltStore/SideStore/installation
        # services reject, so stage it explicitly.
        stage="$(mktemp -d)"
        trap 'rm -rf "$stage"' EXIT
        mkdir -p "$stage/Payload"

        # ditto (not cp) keeps bundle metadata, resource forks and symlinks
        # inside App.app/Frameworks intact.
        ditto "$app" "$stage/Payload/App.app"

        out_dir="build/ios-ipa"
        mkdir -p "$out_dir"
        ipa="$PWD/$out_dir/caldaver-ios-${{ inputs.release_tag }}.ipa"
        rm -f "$ipa"
        (cd "$stage" && zip -qry "$ipa" Payload)

        # Fail loudly rather than publishing another unusable archive: every
        # entry must live under Payload/App.app/.
        names="$(unzip -Z1 "$ipa" | sed 's!/$!!')"
        if ! grep -q '^Payload/App\.app/Info\.plist$' <<<"$names"; then
          echo "::error::.ipa is missing Payload/App.app/Info.plist — refusing to publish"
          echo "$names" | head -n 20
          exit 1
        fi
        stray="$(grep -vE '^Payload/?$|^Payload/App\.app(/|$)' <<<"$names" || true)"
        if [ -n "$stray" ]; then
          echo "::error::.ipa has entries outside Payload/App.app/ — refusing to publish"
          echo "$stray" | head -n 20
          exit 1
        fi

        echo "ipa_path=$out_dir/caldaver-ios-${{ inputs.release_tag }}.ipa" >> "$GITHUB_OUTPUT"
        ls -lh "$ipa"
